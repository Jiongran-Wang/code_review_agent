name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: code_review_agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code_review_agent/requirements.txt
      - name: Install dependencies
        working-directory: code_review_agent
        run: python -m pip install -r requirements.txt
      - name: Production regression checks
        working-directory: code_review_agent
        run: python test_all.py
      - name: Evaluation unit tests
        working-directory: code_review_agent
        run: python -m unittest discover -s evaluation -p 'test_*.py'
      - name: Validate fixture expectations
        working-directory: code_review_agent
        run: python evaluation/validate_dataset.py
      - name: Reproduce published scores and check provenance
        working-directory: code_review_agent
        run: python scripts/verify_published_results.py
      - name: Exercise all three workflows without API calls
        working-directory: code_review_agent
        run: >-
          python -m evaluation.run --backend scripted
          --systems baseline agent agent-verified --verification-version v3
          --max-iterations 8 --output evaluation/runs/ci-smoke
